<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Watchlist</title>
<style>
  :root {
    --bg: #0b0b0f;
    --bg-elevated: #16161d;
    --bg-card: #1c1c25;
    --border: #2a2a35;
    --text: #ededf2;
    --text-dim: #9494a3;
    --text-faint: #63636f;
    --accent: #ff4d6d;
    --accent-dim: #ff4d6d33;
    --accent-2: #7c5cff;
    --done-bg: #14201a;
    --done-border: #24422f;
    --done-text: #6fce8f;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: rgba(11,11,15,0.92);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
    padding: 20px 24px 0;
  }

  .header-top {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
    max-width: 980px;
    margin: 0 auto;
  }

  h1 {
    font-size: 22px;
    margin: 0;
    letter-spacing: -0.02em;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .subtitle {
    color: var(--text-faint);
    font-size: 13px;
  }

  nav.tabs {
    max-width: 980px;
    margin: 16px auto 0;
    display: flex;
    gap: 4px;
    overflow-x: auto;
  }

  nav.tabs button {
    appearance: none;
    border: none;
    background: transparent;
    color: var(--text-dim);
    font-size: 14px;
    font-weight: 600;
    padding: 10px 16px;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    white-space: nowrap;
    transition: color .15s ease;
  }

  nav.tabs button:hover { color: var(--text); }

  nav.tabs button.active {
    color: var(--text);
    border-bottom-color: var(--accent);
  }

  nav.tabs button .count {
    color: var(--text-faint);
    font-weight: 400;
    margin-left: 4px;
  }

  main {
    max-width: 980px;
    margin: 0 auto;
    padding: 20px 24px 80px;
  }

  .controls {
    display: flex;
    gap: 12px;
    align-items: center;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }

  .search-wrap {
    position: relative;
    flex: 1;
    min-width: 200px;
  }

  .search-wrap input {
    width: 100%;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px 10px 36px;
    color: var(--text);
    font-size: 14px;
    outline: none;
    transition: border-color .15s ease;
  }

  .search-wrap input:focus { border-color: var(--accent); }

  .search-wrap::before {
    content: "";
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    width: 14px;
    height: 14px;
    border: 2px solid var(--text-faint);
    border-radius: 50%;
    box-shadow: 5px 5px 0 -3px var(--text-faint);
  }

  .progress-pill {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 6px 14px;
    font-size: 13px;
    color: var(--text-dim);
    white-space: nowrap;
  }

  .progress-bar-mini {
    width: 60px;
    height: 5px;
    border-radius: 999px;
    background: var(--border);
    overflow: hidden;
  }

  .progress-bar-mini > div {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    border-radius: 999px;
    transition: width .2s ease;
  }

  .toggle-hide {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    color: var(--text-dim);
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
  }

  .toggle-hide input { accent-color: var(--accent); width: 14px; height: 14px; }

  .group {
    margin-bottom: 22px;
  }

  .group-title {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-faint);
    margin: 0 0 8px 2px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .list {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .item {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    cursor: pointer;
    transition: background .12s ease, border-color .12s ease;
  }

  .item:hover { border-color: #3a3a48; }

  .item.done {
    background: var(--done-bg);
    border-color: var(--done-border);
  }

  .item input[type=checkbox] {
    width: 18px;
    height: 18px;
    flex-shrink: 0;
    accent-color: var(--accent);
    cursor: pointer;
  }

  .item .label {
    flex: 1;
    min-width: 0;
    font-size: 14px;
    line-height: 1.35;
  }

  .item.done .label { color: var(--done-text); text-decoration: line-through; text-decoration-color: var(--done-border); }

  .item .artist {
    display: block;
    font-size: 12px;
    color: var(--text-faint);
    margin-top: 1px;
  }

  .item.done .artist { color: #3f6a4e; }

  .empty-state {
    text-align: center;
    color: var(--text-faint);
    padding: 60px 20px;
    font-size: 14px;
  }

  footer {
    text-align: center;
    color: var(--text-faint);
    font-size: 12px;
    padding: 24px;
  }

  @media (max-width: 600px) {
    header { padding: 16px 16px 0; }
    main { padding: 16px 16px 60px; }
  }

  #lock-screen {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 50% 20%, #1a1420 0%, var(--bg) 60%);
    padding: 20px;
  }

  .lock-card {
    width: 100%;
    max-width: 320px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 32px 28px;
    text-align: center;
  }

  .lock-icon {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: var(--accent-dim);
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 16px;
    font-size: 20px;
  }

  .lock-card h2 {
    margin: 0 0 6px;
    font-size: 18px;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .lock-card p {
    margin: 0 0 20px;
    font-size: 13px;
    color: var(--text-faint);
  }

  .lock-card input {
    width: 100%;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 11px 14px;
    color: var(--text);
    font-size: 14px;
    outline: none;
    text-align: center;
    letter-spacing: 0.05em;
    transition: border-color .15s ease;
  }

  .lock-card input:focus { border-color: var(--accent); }

  .lock-card input.shake {
    border-color: var(--accent);
    animation: shake .3s ease;
  }

  @keyframes shake {
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
  }

  .lock-card button {
    width: 100%;
    margin-top: 10px;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    border: none;
    border-radius: 10px;
    padding: 11px 14px;
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }

  .lock-error {
    margin-top: 12px;
    font-size: 12px;
    color: var(--accent);
    min-height: 14px;
  }

  [hidden] { display: none !important; }
</style>
</head>
<body>

<div id="lock-screen">
  <div class="lock-card">
    <div class="lock-icon">🔒</div>
    <h2>Watchlist</h2>
    <p>Passwort eingeben, um fortzufahren</p>
    <input type="password" id="lock-input" placeholder="Passwort" autocomplete="off">
    <button id="lock-submit">Entsperren</button>
    <div class="lock-error" id="lock-error"></div>
  </div>
</div>

<div id="app" hidden>

<header>
  <div class="header-top">
    <div>
      <h1>Watchlist</h1>
      <div class="subtitle">Anime, Filme &amp; Serien, Games und Songs im Blick behalten</div>
    </div>
    <div class="progress-pill" id="global-progress">
      <div class="progress-bar-mini"><div id="global-bar" style="width:0%"></div></div>
      <span id="global-text">0 / 0</span>
    </div>
  </div>
  <nav class="tabs" id="tabs"></nav>
</header>

<main>
  <div class="controls">
    <div class="search-wrap">
      <input type="text" id="search" placeholder="Suchen...">
    </div>
    <label class="toggle-hide">
      <input type="checkbox" id="hide-done">
      Erledigte ausblenden
    </label>
  </div>
  <div id="content"></div>
</main>

<footer>Status wird nur lokal im Browser-Tab gemerkt und geht beim Neuladen verloren.</footer>

</div>

// nicht vor jemandem, der sich den Seitenquelltext ansieht. Passwort hier aendern:
const SITE_PASSWORD = "watchlist2026";

const lockScreen = document.getElementById("lock-screen");
const appEl = document.getElementById("app");
const lockInput = document.getElementById("lock-input");
const lockError = document.getElementById("lock-error");

function tryUnlock() {
  if (lockInput.value === SITE_PASSWORD) {
    lockScreen.remove();
    appEl.hidden = false;
  } else {
    lockError.textContent = "Falsches Passwort";
    lockInput.classList.remove("shake");
    void lockInput.offsetWidth;
    lockInput.classList.add("shake");
    lockInput.value = "";
    lockInput.focus();
  }
}

document.getElementById("lock-submit").addEventListener("click", tryUnlock);
lockInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter") tryUnlock();
});

const CATEGORIES = [
  { key: "anime",  label: "Anime",           icon: "🎬" },
  { key: "movies", label: "Filme & Serien",  icon: "🍿" },
  { key: "games",  label: "Games",           icon: "🎮" },
  { key: "songs",  label: "Songs",           icon: "🎧" },
];

// normalize raw data into {id, title, sub, group} items per category
function buildItems() {
  const items = {};

  items.anime = DATA.anime.map((title, i) => ({
    id: "anime-" + i, title, sub: "", group: null,
  }));

  items.movies = DATA.movies.map((title, i) => ({
    id: "movies-" + i, title, sub: "", group: null,
  }));

  items.games = DATA.games.map((title, i) => ({
    id: "games-" + i, title, sub: "", group: null,
  }));

  items.songs = DATA.songs.map((s, i) => ({
    id: "songs-" + i, title: s.title, sub: s.artist, group: s.artist,
  }));

  return items;
}

const ITEMS = buildItems();

// state: Set of checked item ids, in-memory only for this session
const checked = new Set();

let activeTab = "anime";
let hideDone = false;
let searchQuery = "";

function norm(s) {
  return (s || "").toLowerCase();
}

function totalCounts() {
  let total = 0, done = 0;
  CATEGORIES.forEach(c => {
    ITEMS[c.key].forEach(it => {
      total++;
      if (checked.has(it.id)) done++;
    });
  });
  return { total, done };
}

function categoryCounts(key) {
  const list = ITEMS[key];
  let done = 0;
  list.forEach(it => { if (checked.has(it.id)) done++; });
  return { total: list.length, done };
}

function renderTabs() {
  const nav = document.getElementById("tabs");
  nav.innerHTML = "";
  CATEGORIES.forEach(c => {
    const { total, done } = categoryCounts(c.key);
    const btn = document.createElement("button");
    btn.className = c.key === activeTab ? "active" : "";
    btn.innerHTML = c.icon + " " + c.label + ' <span class="count">' + done + "/" + total + "</span>";
    btn.addEventListener("click", () => { activeTab = c.key; render(); });
    nav.appendChild(btn);
  });
}

function renderGlobalProgress() {
  const { total, done } = totalCounts();
  const pct = total ? Math.round((done / total) * 100) : 0;
  document.getElementById("global-bar").style.width = pct + "%";
  document.getElementById("global-text").textContent = done + " / " + total;
}

function toggleItem(id) {
  if (checked.has(id)) checked.delete(id); else checked.add(id);
  render();
}

function renderList() {
  const content = document.getElementById("content");
  content.innerHTML = "";

  const list = ITEMS[activeTab];
  const q = norm(searchQuery);

  let filtered = list.filter(it => {
    if (hideDone && checked.has(it.id)) return false;
    if (!q) return true;
    return norm(it.title).includes(q) || norm(it.sub).includes(q);
  });

  if (filtered.length === 0) {
    const empty = document.createElement("div");
    empty.className = "empty-state";
    empty.textContent = "Keine Treffer.";
    content.appendChild(empty);
    return;
  }

  if (activeTab === "songs") {
    // group by artist
    const groups = new Map();
    filtered.forEach(it => {
      const g = it.group || "Unbekannt";
      if (!groups.has(g)) groups.set(g, []);
      groups.get(g).push(it);
    });
    const sortedKeys = Array.from(groups.keys()).sort((a, b) => norm(a).localeCompare(norm(b)));
    sortedKeys.forEach(g => {
      const wrap = document.createElement("div");
      wrap.className = "group";
      const title = document.createElement("div");
      title.className = "group-title";
      title.textContent = g;
      wrap.appendChild(title);
      const listEl = document.createElement("div");
      listEl.className = "list";
      groups.get(g).forEach(it => listEl.appendChild(renderItem(it)));
      wrap.appendChild(listEl);
      content.appendChild(wrap);
    });
  } else {
    const listEl = document.createElement("div");
    listEl.className = "list";
    filtered.forEach(it => listEl.appendChild(renderItem(it)));
    content.appendChild(listEl);
  }
}

function renderItem(it) {
  const row = document.createElement("div");
  const isDone = checked.has(it.id);
  row.className = "item" + (isDone ? " done" : "");
  row.addEventListener("click", (e) => {
    if (e.target.tagName.toLowerCase() !== "input") toggleItem(it.id);
  });

  const cb = document.createElement("input");
  cb.type = "checkbox";
  cb.checked = isDone;
  cb.addEventListener("change", () => toggleItem(it.id));

  const label = document.createElement("div");
  label.className = "label";
  label.textContent = it.title;
  if (it.sub && activeTab !== "songs") {
    const sub = document.createElement("span");
    sub.className = "artist";
    sub.textContent = it.sub;
    label.appendChild(sub);
  }

  row.appendChild(cb);
  row.appendChild(label);
  return row;
}

function render() {
  renderTabs();
  renderGlobalProgress();
  renderList();
}

document.getElementById("search").addEventListener("input", (e) => {
  searchQuery = e.target.value;
  renderList();
});

document.getElementById("hide-done").addEventListener("change", (e) => {
  hideDone = e.target.checked;
  renderList();
});

render();
</script>
